media:
  input: static/assets
  output: /assets
content:
  - name: start
    label: "START HERE: how to run the site (admin link inside)"
    type: file
    path: content/start-here.json
    format: json
    fields:
      - name: admin
        label: "1. Admin (Publish, Codes, Stats, Settings)"
        type: string
        description: "Open https://www.everettallenphotography.com/client/admin/ for Publish (upload photos), Codes (free download codes and their links), Stats (visits and photo likes) and Settings (Stripe, GitHub token, NAS folder key)."
      - name: photos
        label: "2. Adding photos"
        type: string
        description: "Browser: Admin > Publish. NAS: export into EAP-Publish in a folder named like 2026-11-06 TCLF Friday, then add -READY to the end of the folder name. It becomes -PUBLISHED when done (or -FAILED). After publishing, come back here to Galleries to tidy the title, series, tags and cover."
      - name: galleries
        label: "3. Editing galleries"
        type: string
        description: "Galleries: keep the year in the title (2026 TCLF Friday). Cover photo ID picks the Events page tile and the Facebook preview. New recurring events go in Event series first; the Series dropdown updates about a minute later."
      - name: codes
        label: "4. Free download codes"
        type: string
        description: "Admin > Codes. Each code has a copyable link like https://www.everettallenphotography.com/events/?code=your-code. Opening it unlocks free downloads in that person's browser, and the code keeps a log of what they downloaded."
      - name: fixes
        label: "5. If something looks wrong"
        type: string
        description: "Wait two minutes after saving, then refresh. Check https://github.com/drewanmpls/everettallen-site/actions for a red X. Facebook showing the wrong picture: paste the address at https://developers.facebook.com/tools/debug/ and click Scrape Again. Full cheat sheet: https://claude.ai/artifact/2UUp61c3o6VbS9Y7STQVnx"
  - name: galleries
    label: Galleries
    type: collection
    path: content/galleries
    format: json
    extension: json
    fields:
      - { name: title, label: Title, type: string }
      - { name: category, label: Category, type: select, options: { values: [portraits, events] } }
      - { name: year, label: Event year (groups the Events page), type: string }
      - { name: series, label: Recurring event series (shows on the Events page and gets its own page), type: select, options: { values: [tclfw, leather-at-twin-cities-pride, mnlp, atons, iml-imbb, twin-cities-pride, deconstructed-pride, mme, umbra, weddings] } }
      - { name: date, label: Date (YYYY-MM-DD, newest first within a year), type: string }
      - { name: tags, label: Tags (one per line or press Enter after each; they become search chips and tag pages), type: string, list: true }
      - { name: cover, label: Cover photo ID (e.g. 001), type: string }
      - { name: description, label: Description, type: text }
      - name: images
        label: Photos
        type: object
        list: true
        fields:
          - { name: id, label: Photo ID (files are photos/GALLERY/ID-t.jpg and ID-l.jpg), type: string }
          - { name: ratio, label: Width divided by height, type: number }
  - name: series
    label: Event series (names, short labels, descriptions)
    type: file
    path: content/series.json
    format: json
    fields:
      - name: series
        label: Series
        type: object
        list: true
        fields:
          - { name: slug, label: Slug (lowercase, dashes; also add it to the Series list on galleries), type: string }
          - { name: name, label: Full name, type: string }
          - { name: short, label: Short label for the By event row, type: string }
          - { name: desc, label: Short description, type: text }
  - name: pages
    label: Pages (About, Press and licensing, Photo removal)
    type: collection
    path: content/pages
    format: json
    extension: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: lede, label: Short intro line, type: string }
      - { name: desc, label: Search and share description, type: string }
      - { name: body, label: "Text (blank line between paragraphs; **bold**, *italic*, [link text](/page/))", type: text }
  - name: services
    label: Services and rates
    type: file
    path: content/services.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: lede, label: Short intro line, type: string }
      - { name: delivery, label: Delivery notice, type: text }
      - { name: callout, label: Prints callout (email addresses become links), type: text }
      - { name: cta, label: Line above the Contact button, type: string }
      - { name: share_discount_percent, label: Discount (percent) for allowing photo sharing (0 = no offer), type: number }
      - { name: share_note, label: "Services page sentence about the discount ({percent} becomes the number)", type: text }
      - { name: release_title, label: Release title, type: string }
      - { name: release_version, label: Release version label (change it when you edit the wording), type: string }
      - { name: release_terms, label: Release paragraphs (shown on the form and saved into each signed PDF), type: text, list: true }
      - name: release_definitions
        label: Release definitions
        type: object
        list: true
        fields:
          - { name: term, label: Term, type: string }
          - { name: text, label: Meaning, type: text }
      - { name: release_gallery_question, label: Gallery display question, type: string }
      - { name: release_consideration, label: "Discount sentence ({percent} becomes the number)", type: text }
      - name: cards
        label: Rate cards
        type: object
        list: true
        fields:
          - { name: title, label: Name, type: string }
          - { name: price, label: Price (like $175), type: string }
          - { name: unit, label: Unit (like / hour), type: string }
          - { name: meta, label: Length and looks, type: string }
          - { name: badge, label: Badge (like Most popular, makes the card dark), type: string }
          - { name: included, label: Photos included in the client gallery package (0 = none), type: number }
          - { name: wide, label: Full-width card, type: boolean }
          - { name: items, label: What's included, type: string, list: true }
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: tagline, label: Home tagline, type: string }
      - { name: featured_portraits, label: Featured portraits on the home page (gallery names, in order), type: string, list: true }
      - { name: contact_intro, label: Contact page intro, type: text }
      - { name: usage_note, label: Note under each gallery, type: text }
      - { name: facebook, label: Facebook URL, type: string }
      - { name: instagram, label: Instagram URL, type: string }
